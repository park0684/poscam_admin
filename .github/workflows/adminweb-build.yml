name: AdminWeb Build

on:
  pull_request:
    paths:
      - "AdminWeb/**"
      - ".github/workflows/adminweb-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AdminWeb/poscam.AdminWeb.csproj

      - name: Build
        run: >-
          dotnet build AdminWeb/poscam.AdminWeb.csproj
          --configuration Release
          --no-restore
          --verbosity normal
