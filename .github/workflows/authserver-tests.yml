name: AuthServer Tests

on:
  pull_request:
    paths:
      - "AuthServer/**"
      - "AuthServer.Tests/**"
      - ".github/workflows/authserver-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AuthServer.Tests/poscam.AuthServer.Tests.csproj

      - name: Test
        run: >-
          dotnet test AuthServer.Tests/poscam.AuthServer.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal
